# ─────────────────────────────────────────────────────────────────
#  Casino Online – docker-compose.yml  (rama Natalia)
#  Levanta: wallet-service · admin-service · MySQL · Kafka · Eureka
#
#  Servicios de otros integrantes (auth, audit, game, api-gateway)
#  se agregan cuando el equipo integre. Eureka corre como imagen
#  standalone sin necesidad de build local.
# ─────────────────────────────────────────────────────────────────

networks:
  casino-net:
    driver: bridge

volumes:
  mysql_data:
  kafka_data:

services:

  # ── ZOOKEEPER (requerido por Kafka) ─────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: casino-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - casino-net
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── KAFKA ────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: casino-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - casino-net
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── MYSQL ────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: casino-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: casino_db
      MYSQL_USER: casino_user
      MYSQL_PASSWORD: casino_pass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-scripts/mysql:/docker-entrypoint-initdb.d
    networks:
      - casino-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "casino_user", "-pcasino_pass"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── EUREKA SERVER (imagen pública, sin build local) ──────────────
  # Mientras Mileth no comparta su carpeta eureka-server, usamos
  # esta imagen lista. Expone el dashboard en http://localhost:8761
  eureka-server:
    image: steeltoeoss/eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - casino-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8761"]
      interval: 20s
      timeout: 10s
      retries: 10

  # ── WALLET SERVICE  (Natalia · Python · MySQL) ───────────────────
  wallet-service:
    build: ./wallet-service
    container_name: wallet-service
    ports:
      - "8082:8082"
    environment:
      DATABASE_URL: mysql+pymysql://casino_user:casino_pass@mysql:3306/casino_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: casino_jwt_super_secret_2025
      SERVICE_PORT: "8082"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - casino-net

  # ── ADMIN SERVICE  (Natalia · Python · MySQL) ────────────────────
  admin-service:
    build: ./admin-service
    container_name: admin-service
    ports:
      - "8085:8085"
    environment:
      DATABASE_URL: mysql+pymysql://casino_user:casino_pass@mysql:3306/casino_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: casino_jwt_super_secret_2025
      SERVICE_PORT: "8085"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - casino-net
