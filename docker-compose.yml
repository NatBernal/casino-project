networks:
  casino-net:
    driver: bridge

volumes:
  mysql_data:
  mongo_data:
  redis_data:
  kafka_data:

services:

  # ── ZOOKEEPER ────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: casino-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - casino-net
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── KAFKA ────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: casino-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      - casino-net
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── MONGODB ──────────────────────────────────────────────────────
  mongodb:
    image: mongo:4.4
    container_name: casino-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: casino_admin
      MONGO_INITDB_ROOT_PASSWORD: casino_secret
      MONGO_INITDB_DATABASE: casino_db
    volumes:
      - mongo_data:/data/db
    networks:
      - casino-net
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MYSQL ────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: casino-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: casino_db
      MYSQL_USER: casino_user
      MYSQL_PASSWORD: casino_pass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-scripts/mysql:/docker-entrypoint-initdb.d
    networks:
      - casino-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "casino_user", "-pcasino_pass"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── REDIS ────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: casino-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass redis_secret --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - casino-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_secret", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── EUREKA SERVER ────────────────────────────────────────────────
  eureka-server:
    image: steeltoeoss/eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - casino-net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8761 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10

  # ── AUTH SERVICE  (Java · MongoDB · Kafka) ───────────────────────
  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8081:8081"

    env_file:
      - ./auth-service/.env

    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATA_MONGODB_URI: mongodb://casino_admin:casino_secret@mongodb:27017/casino_db?authSource=admin
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: casino_jwt_super_secret_key_2025
      JWT_EXPIRATION_MS: "3600000"

    depends_on:
      eureka-server:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy

    networks:
      - casino-net

  # ── WALLET SERVICE  (Python · MySQL) — sin Kafka ─────────────────
  wallet-service:
    build: ./wallet-service
    container_name: wallet-service
    ports:
      - "8082:8082"
    environment:
      DATABASE_URL: mysql+pymysql://casino_user:casino_pass@mysql:3306/casino_db
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: casino_jwt_super_secret_2025
      SERVICE_PORT: "8082"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - casino-net

  # ── ADMIN SERVICE  (Python · MySQL) — sin Kafka ──────────────────
  admin-service:
    build: ./admin-service
    container_name: admin-service
    ports:
      - "8085:8085"
    environment:
      DATABASE_URL: mysql+pymysql://casino_user:casino_pass@mysql:3306/casino_db
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: casino_jwt_super_secret_2025
      SERVICE_PORT: "8085"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - casino-net

  # ── GAME SERVICE  (Node.js · Redis) ──────────────────────────────
  game-service:
    build: ./game-service
    container_name: game-service
    ports:
      - "8083:8083"
    environment:
      EUREKA_HOST: eureka-server
      EUREKA_PORT: "8761"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: redis_secret
      JWT_SECRET: casino_jwt_super_secret_2025
      PORT: "8083"
    depends_on:
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - casino-net

  # ── AUDIT SERVICE  (Java · MongoDB) ────────────────────────────────────
  audit-service:
    build: ./audit-service
    container_name: audit-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATA_MONGODB_URI=mongodb://casino_admin:casino_secret@mongodb:27017/casino_db?authSource=admin
    depends_on:
      eureka-server:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - casino-net
  # ── FRONTEND ───────────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: casino-frontend
    ports:
      - "3000:80"
    environment:
      - REACT_APP_AUTH_URL=http://auth-service:8081
      - REACT_APP_WALLET_URL=http://wallet-service:8082
      - REACT_APP_GAME_URL=http://game-service:8083
    depends_on:
      - auth-service
      - wallet-service
      - game-service
    networks:
      - casino-net
