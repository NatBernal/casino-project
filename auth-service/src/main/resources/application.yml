server:
  port: 8081

spring:
  application:
    name: auth-service

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://casino_admin:casino_secret@localhost:27017/casino_db?authSource=admin}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

  security:
    user:
      password: disabled

jwt:
  secret: ${JWT_SECRET:casino_jwt_super_secret_2025}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    co.casino: DEBUG
